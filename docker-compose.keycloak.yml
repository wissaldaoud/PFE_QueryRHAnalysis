# ============================================
# Docker Compose - Keycloak SSO Server
# Query HR Analytics Online - PFE SOPRAHR
# ============================================

version: '3.8'

services:
  # ============================================
  # Keycloak Identity Server
  # ============================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: hr-analytics-keycloak
    environment:
      # Admin credentials
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      
      # Database (using embedded H2 for development)
      # For production, use PostgreSQL
      KC_DB: dev-file
      
      # Health check
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      
    ports:
      - "8080:8080"  # Keycloak web interface
    
    command:
      - start-dev  # Development mode (for production use: start)
    
    volumes:
      - keycloak_data:/opt/keycloak/data
    
    networks:
      - hr-analytics-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # PostgreSQL (for Keycloak production)
  # Uncomment for production deployment
  # ============================================
  # keycloak-db:
  #   image: postgres:16-alpine
  #   container_name: keycloak-postgres
  #   environment:
  #     POSTGRES_DB: keycloak
  #     POSTGRES_USER: keycloak
  #     POSTGRES_PASSWORD: keycloak_password
  #   volumes:
  #     - keycloak_postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - hr-analytics-network

volumes:
  keycloak_data:
  # keycloak_postgres_data:

networks:
  hr-analytics-network:
    driver: bridge
