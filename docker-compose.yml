version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hr_analytics_db
    environment:
      POSTGRES_USER: hranalytics
      POSTGRES_PASSWORD: hranalytics2026
      POSTGRES_DB: hr_analytics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hr_analytics_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hranalytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr_analytics_backend
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=hranalytics
      - POSTGRES_PASSWORD=hranalytics2026
      - POSTGRES_DB=hr_analytics_db
      - POSTGRES_PORT=5432
      - ML_SERVICE_URL=http://ml-service:8001
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - hr_analytics_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ML Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: hr_analytics_ml_service
    environment:
      - SERVICE_PORT=8001
    ports:
      - "8001:8001"
    volumes:
      - ./ml-service/app:/app/app
    networks:
      - hr_analytics_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hr_analytics_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
      - ml-service
    networks:
      - hr_analytics_network

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: hr_analytics_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - hr_analytics_network
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts

volumes:
  postgres_data:
  mlflow_data:

networks:
  hr_analytics_network:
    driver: bridge
